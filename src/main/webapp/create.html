<!DOCTYPE html>
<html><head>
    <meta charset="UTF-8"><title>Create Table</title><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:linear-gradient(135deg,#0f172a,#164e63);display:flex;align-items:center;justify-content:center;color:#e2e8f0;padding:20px}.card{width:min(500px,100%);background:#ffffff12;border:1px solid #ffffff20;border-radius:24px;padding:35px;backdrop-filter:blur(14px);box-shadow:0 20px 50px #0005;animation:up .6s ease}.tag{color:#5eead4;font-size:12px;letter-spacing:1.5px}.icon{font-size:38px;margin:10px 0}h1{margin:0 0 25px;font-size:30px}.field{margin-bottom:18px}label{display:block;color:#cbd5e1;font-size:14px;margin-bottom:8px}input[type=text]{width:100%;padding:14px 15px;border:1px solid #475569;border-radius:12px;background:#0f172a99;color:white;font-size:15px;outline:none}input[type=text]:focus{border-color:#5eead4;box-shadow:0 0 0 3px #5eead422}.actions{display:flex;gap:12px;margin-top:22px}input[type=submit],input[type=reset],.back{border:0;border-radius:12px;padding:12px 20px;font-weight:bold;cursor:pointer;text-decoration:none;font-size:14px}.submit{background:#2dd4bf;color:#042f2e}.reset{background:#334155;color:#e2e8f0}.back{display:block;text-align:center;margin-top:18px;color:#94a3b8;border:1px solid #334155}.back:hover{color:#5eead4;border-color:#5eead4}@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style></head><body><div class="card"><div class="tag">DATABASE OPERATION</div><div class="icon">&#43;</div><h1>Create Table</h1><form action="create" method="GET"><div class="field"><label>Table Name</label><input type="text" name="tableName" placeholder="Enter table name" required></div><div class="field"><label>Number of Columns</label><input type="text" name="columnCount" placeholder="e.g. 4" required></div><div class="actions"><input class="reset" type="reset" value="Reset"><input class="submit" type="submit" value="Submit"></div></form><a class="back" href="home.html">&#8592; Back to Dashboard</a></div></body></html>
